<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTPSecure</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BTPSecure.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        :root {
            --rz-primary: #1565C0;
            --rz-primary-light: #1E88E5;
            --rz-primary-lighter: #42A5F5;
        }

        .btp-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1e88e5 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .btp-loader__shield {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            animation: btp-pulse 2s ease-in-out infinite;
        }

        .btp-loader__shield svg {
            width: 56px;
            height: 56px;
            fill: #fff;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
        }

        .btp-loader__title {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .btp-loader__subtitle {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.85;
            letter-spacing: 0.3px;
        }

        .btp-loader__bar {
            width: 220px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
            position: relative;
        }

        .btp-loader__bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: btp-slide 1.4s ease-in-out infinite;
        }

        @keyframes btp-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); }
            50% { transform: scale(1.05); box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35); }
        }

        @keyframes btp-slide {
            0% { left: -40%; }
            100% { left: 100%; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="btp-loader">
            <div class="btp-loader__shield">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                </svg>
            </div>
            <h1 class="btp-loader__title">BTPSecure</h1>
            <p class="btp-loader__subtitle">Chargement en cours...</p>
            <div class="btp-loader__bar"></div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        Une erreur est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">&#x1F5D9;</span>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.66stpp682q.js"></script>
</body>

</html>

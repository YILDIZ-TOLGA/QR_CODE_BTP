    <style>
        :root {
            /* Charte KEYDO — turquoise de reference #00C9B7 */
            --rz-primary: #00C9B7;
            --rz-primary-light: #33D6C7;
            --rz-primary-lighter: #66E2D6;
            --rz-primary-dark: #00A99A;
            --rz-primary-darker: #008577;

            /* Fond des pages : gris souris ; cartes/panneaux : blanc (contraste) */
            --rz-layout-background-color: #AEB4B9;
            --rz-body-background-color: #AEB4B9;
            --rz-card-background-color: #ffffff;
            --rz-panel-background-color: #ffffff;
        }

        /* Les cartes "Outlined" sont transparentes par defaut dans Radzen : sur le fond
           gris souris elles laisseraient voir le gris. On force leur interieur en blanc.
           Les cartes avec un background inline (sous-panneaux gris volontaires) ne sont
           pas touchees : le style inline reste prioritaire. */
        .rz-card.rz-variant-outlined {
            background-color: var(--rz-card-background-color);
        }

        .btp-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background: linear-gradient(135deg, #008577 0%, #00C9B7 50%, #33D6C7 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .btp-loader__shield {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            animation: btp-pulse 2s ease-in-out infinite;
        }

        .btp-loader__shield svg {
            width: 56px;
            height: 56px;
            fill: #fff;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
        }

        .btp-loader__title {
            margin: 0;
            line-height: 0;
        }

        .btp-loader__title svg {
            height: 34px;
            width: auto;
            fill: #fff;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
        }

        .btp-loader__subtitle {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.85;
            letter-spacing: 0.3px;
        }

        .btp-loader__bar {
            width: 220px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
            position: relative;
        }

        .btp-loader__bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: btp-slide 1.4s ease-in-out infinite;
        }

        @keyframes btp-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); }
            50% { transform: scale(1.05); box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35); }
        }

        @keyframes btp-slide {
            0% { left: -40%; }
            100% { left: 100%; }
        }
    </style>
</head>

    <script>
        // Suivi de l'inactivité : aucun composant Radzen ne capte l'activité globale
        // de la page. Simple horodatage remis à zéro à chaque interaction ; c'est Blazor
        // qui interroge la durée écoulée, donc aucun rappel JS -> .NET à gérer.
        window.keydoInactivite = (function () {
            var dernierEvenement = Date.now();

            function marquerActivite() {
                dernierEvenement = Date.now();
            }

            var evenements = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'wheel'];
            for (var i = 0; i < evenements.length; i++) {
                document.addEventListener(evenements[i], marquerActivite, { passive: true, capture: true });
            }

            return {
                secondes: function () {
                    return Math.floor((Date.now() - dernierEvenement) / 1000);
                },
                reinitialiser: marquerActivite
            };
        })();

        // Téléchargement d'un fichier depuis une chaîne base64 (pièces jointes des tickets).
        // Passe par un Blob : fiable sur Chrome qui bloque la navigation vers les data: URI.
        window.btpTelechargerFichier = function (base64, nom, type) {
            var octets = atob(base64);
            var tableau = new Uint8Array(octets.length);
            for (var i = 0; i < octets.length; i++) {
                tableau[i] = octets.charCodeAt(i);
            }
            var blob = new Blob([tableau], { type: type });
            var url = URL.createObjectURL(blob);
            var lien = document.createElement('a');
            lien.href = url;
            lien.download = nom;
            document.body.appendChild(lien);
            lien.click();
            document.body.removeChild(lien);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        };
    </script>
